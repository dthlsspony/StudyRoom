name: studyroom

x-app-env: &app-env
  APP_NAME: ${APP_NAME:-StudyRoom}
  APP_ENV: ${APP_ENV:-local}
  APP_DEBUG: ${APP_DEBUG:-true}
  APP_URL: ${APP_URL:-http://localhost:8080}
  # Драйвер вещания: без него Laravel берёт NullBroadcaster, у которого auth()
  # возвращает пустоту — подписка на каналы и рассылка событий не работают.
  BROADCAST_CONNECTION: ${BROADCAST_CONNECTION:-reverb}
  DB_CONNECTION: ${DB_CONNECTION:-pgsql}
  DB_HOST: ${DB_HOST:-db}
  DB_PORT: ${DB_PORT:-5432}
  DB_DATABASE: ${DB_DATABASE:-studyroom}
  DB_USERNAME: ${DB_USERNAME:-studyroom}
  DB_PASSWORD: ${DB_PASSWORD:-studyroom}
  LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-devkey}
  LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-devsecret}
  LIVEKIT_URL: ${LIVEKIT_URL:-ws://localhost:7880}
  LIVEKIT_API_URL: ${LIVEKIT_API_URL:-http://livekit:7880}
  LIVEKIT_WEBHOOK_URL: ${LIVEKIT_WEBHOOK_URL:-http://web/api/v1/livekit/webhook}
  REVERB_APP_ID: ${REVERB_APP_ID:-studyroom}
  REVERB_APP_KEY: ${REVERB_APP_KEY:-studyroomappkey}
  REVERB_APP_SECRET: ${REVERB_APP_SECRET:-studyroomappsecret}
  REVERB_HOST: ${REVERB_HOST:-localhost}
  # Внутренний порт Reverb: backend и сам Reverb живут в одном контейнере.
  REVERB_PORT: 8081
  REVERB_SCHEME: ${REVERB_SCHEME:-http}

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-studyroom}
      POSTGRES_USER: ${DB_USERNAME:-studyroom}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-studyroom}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      # Порт БД на хосте. Отдельно от DB_PORT (того, что видит приложение
      # внутри сети Docker): если 5432 на хосте уже занят своим Postgres,
      # поставьте здесь свободный порт.
      - "${DB_PUBLISHED_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-studyroom} -d ${DB_DATABASE:-studyroom}"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    restart: unless-stopped
    entrypoint: ["/bin/bash", "/usr/local/bin/entrypoint.sh"]
    environment:
      <<: *app-env
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
      - ./docker/php/entrypoint.sh:/usr/local/bin/entrypoint.sh:ro
    ports:
      # Reverb (websocket-сервер для чата) — доступен браузеру напрямую.
      # Порт Reverb на хосте. Внутренний порт всегда 8081 — если на сервере
      # 8081 занят, меняйте только этот (хостовый) порт.
      - "${REVERB_PUBLISHED_PORT:-8081}:8081"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./frontend/dist:/var/www/html:ro
    depends_on:
      - app

  frontend:
    build:
      context: .
      dockerfile: docker/node/Dockerfile
    restart: unless-stopped
    ports:
      - "${VITE_PORT:-5173}:5173"
    environment:
      VITE_API_URL: ""
      # Адрес Reverb для браузера и для backend — разные вещи: backend ходит
      # в Reverb внутри контейнера (localhost), браузер — через домен. Поэтому
      # VITE_* берутся из своих переменных, а не из REVERB_*.
      VITE_REVERB_KEY: ${VITE_REVERB_KEY:-${REVERB_APP_KEY:-studyroomappkey}}
      VITE_REVERB_HOST: ${VITE_REVERB_HOST:-${REVERB_HOST:-localhost}}
      VITE_REVERB_PORT: ${VITE_REVERB_PORT:-${REVERB_PUBLISHED_PORT:-8081}}
      VITE_REVERB_SCHEME: ${VITE_REVERB_SCHEME:-${REVERB_SCHEME:-http}}
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - app

  livekit:
    image: livekit/livekit-server:v1.13.11
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/livekit-entrypoint.sh"]
    environment:
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-devkey}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-devsecret}
      LIVEKIT_WEBHOOK_URL: ${LIVEKIT_WEBHOOK_URL:-http://web/api/v1/livekit/webhook}
      LIVEKIT_NODE_IP: ${LIVEKIT_NODE_IP:-}
      LIVEKIT_UDP_PORT: ${LIVEKIT_UDP_PORT:-7882}
      LIVEKIT_TCP_PORT: ${LIVEKIT_TCP_PORT:-7881}
    volumes:
      - ./docker/livekit/entrypoint.sh:/livekit-entrypoint.sh:ro
    ports:
      # Порт сигналинга (WebSocket) — на него смотрит обратный прокси.
      - "${LIVEKIT_HTTP_PORT:-7880}:7880"
      # ICE поверх TCP — запасной транспорт для медиа. Номер порта должен
      # совпадать с тем, что LiveKit объявляет в кандидатах, поэтому
      # пробрасываем его без изменения.
      - "${LIVEKIT_TCP_PORT:-7881}:${LIVEKIT_TCP_PORT:-7881}"
      # Медиа по UDP: этот порт LiveKit объявляет в ICE-кандидатах,
      # поэтому он должен совпадать с открытым в firewall.
      - "${LIVEKIT_UDP_PORT:-7882}:${LIVEKIT_UDP_PORT:-7882}/udp"

volumes:
  db_data:
  backend_vendor:
  frontend_node_modules:
