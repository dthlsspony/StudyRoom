# Дополнительный compose-файл для боевого развёртывания.
#
# Убирает публикацию на хост портов, которые снаружи не нужны:
#   — БД: приложение ходит к ней по внутренней сети Docker, а на сервере
#     уже может слушать свой Postgres на 5432;
#   — Reverb: браузер подключается к нему через обратный прокси
#     (wss://study-room.quietroom.name/app), прямой доступ не требуется.
#
# Порт медиа LiveKit (UDP) остаётся опубликованным — он обязателен:
# до него доходят ICE-кандидаты извне.
#
# Использование:
#   COMPOSE_EXTRA_FILE=deploy/docker-compose.no-host-ports.yml ./deploy/deploy.sh
#
services:
  db:
    ports: !reset []

  app:
    ports: !reset []
