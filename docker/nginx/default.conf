server {
    listen 80;
    server_name _;

    root /var/www/html;
    index index.html;

    client_max_body_size 32m;

    # Laravel API
    location /api/ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param APP_BASE_PATH /var/www/html;
        fastcgi_pass app:9000;
        fastcgi_read_timeout 120s;
    }

    # Laravel broadcasting auth endpoint
    location /broadcasting/ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_pass app:9000;
    }

    # Reverb: WebSocket-канал чата (протокол Pusher). Именно этот путь
    # использует laravel-echo в браузере: wss://<домен>/app
    location /app {
        proxy_pass http://app:8081;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # index.html не кэшируем: иначе после деплоя браузер продолжает просить
    # старый бандл, а файла с прежним хэшем в имени уже нет (404).
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # Файлы в /assets с хэшем в имени неизменяемы — кэшируем надолго.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
